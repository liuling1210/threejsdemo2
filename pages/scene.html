<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js GLB Loader - ????</title>
    <link rel="stylesheet" href="../css/common.css" />
    <script type="importmap">
{
        "imports": {
          "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-module="scene">
<canvas id="viewport"></canvas>

    <div id="modelInfoDock" class="model-info-dock">
      <div id="modelInfoPanel">
        <div class="info-title panel-drag-handle">模型信息</div>
        <div id="modelInfoFileSize">文件大小: —</div>
        <div id="modelInfoFaces">面数: —</div>
        <div id="modelInfoFps">帧率: —</div>
      </div>
      <div class="model-info-dock-actions">
        <button type="button" id="saveSettingsDocBtn" class="settings-doc-btn">保存成文档</button>
        <button type="button" id="loadSettingsDocBtn" class="settings-doc-btn">加载设置</button>
        <input type="file" id="loadSettingsFileInput" accept=".txt,text/plain,application/json" hidden />
      </div>
    </div>

    <div id="leftPanelsWrap">
    <div class="panel-drag-handle panel-drag-handle--bar" title="拖拽移动">左侧面板</div>
    <!-- 左侧光照面板：环境光 + 主光源平行光 -->
    <div id="leftLightingPanel">
      <h3>光照系统</h3>

      <div class="lighting-control-group">
        <div class="lighting-param-row">
          <label>环境光强度</label>
          <input type="range" id="leftHemiIntensity" min="0" max="2" step="0.1" value="1.0" />
          <input type="number" id="leftHemiIntensityValue" min="0" max="2" step="0.1" value="1.0" />
        </div>
      </div>

      <div class="lighting-control-group">
        <div class="lighting-param-row">
          <label>平行光强度</label>
          <input type="range" id="leftDirIntensity" min="0" max="3" step="0.1" value="1.5" />
          <input type="number" id="leftDirIntensityValue" min="0" max="3" step="0.1" value="1.5" />
        </div>
        <label style="margin-top: 8px;">位置</label>
        <div class="lighting-control-row">
          <label>X:</label>
          <input type="number" id="leftDirX" step="0.5" value="5" />
          <label>Y:</label>
          <input type="number" id="leftDirY" step="0.5" value="10" />
          <label>Z:</label>
          <input type="number" id="leftDirZ" step="0.5" value="7.5" />
        </div>
      </div>
    </div>

    <!-- 场景与地面面板 -->
    <div id="leftScenePanel">
      <h3>场景与地面</h3>
      <div class="lighting-control-group">
        <label>模型位置</label>
        <div class="lighting-control-row">
          <label>X:</label>
          <input type="number" id="modelPosX" step="0.1" value="0" />
          <label>Y:</label>
          <input type="number" id="modelPosY" step="0.1" value="0" />
          <label>Z:</label>
          <input type="number" id="modelPosZ" step="0.1" value="0" />
        </div>
      </div>
      <div class="lighting-control-group">
        <label>场景背景颜色</label>
        <div class="lighting-control-row">
          <input type="color" id="sceneBgColor" value="#cccccc" />
        </div>
      </div>
      <div class="lighting-control-group">
        <label>地面平台</label>
        <div class="lighting-control-row">
          <label>宽:</label>
          <input type="number" id="groundSizeW" min="1" step="1" value="20" />
          <label>深:</label>
          <input type="number" id="groundSizeD" min="1" step="1" value="20" />
        </div>
        <div class="lighting-control-row">
          <label>颜色:</label>
          <input type="color" id="groundColor" value="#888888" />
        </div>
      </div>
      <div class="lighting-control-group">
        <div class="lighting-toggle">
          <input type="checkbox" id="shadowEnabled" />
          <label for="shadowEnabled">阴影开关</label>
        </div>
        <label>阴影深浅</label>
        <div class="lighting-control-row">
          <input type="range" id="shadowStrength" min="0" max="2" step="0.05" value="1" />
          <input type="number" id="shadowStrengthValue" min="0" max="2" step="0.05" value="1" style="width:50px;" />
        </div>
        <label>阴影柔和度</label>
        <div class="lighting-control-row">
          <input type="range" id="shadowRadius" min="0" max="10" step="0.5" value="0" />
          <input type="number" id="shadowRadiusValue" min="0" max="10" step="0.5" value="0" style="width:50px;" />
        </div>
        <label style="margin-top: 8px;">阴影方向</label>
        <div class="lighting-control-row">
          <label>X:</label>
          <input type="number" id="shadowDirX" step="0.1" value="5" />
          <label>Y:</label>
          <input type="number" id="shadowDirY" step="0.1" value="10" />
          <label>Z:</label>
          <input type="number" id="shadowDirZ" step="0.1" value="7.5" />
        </div>
      </div>
      <div class="lighting-control-group">
        <div class="lighting-toggle">
          <input type="checkbox" id="groundGridEnabled" />
          <label for="groundGridEnabled">地面网格</label>
        </div>
      </div>
      <div class="lighting-control-group">
        <div class="lighting-toggle">
          <input type="checkbox" id="modelAxesEnabled" />
          <label for="modelAxesEnabled">模型三轴</label>
        </div>
      </div>
      <div class="lighting-control-group">
        <label>立方体面板</label>
        <div class="lighting-control-row">
          <button type="button" id="addPanelCubeBtn">新增立方体</button>
          <button type="button" id="removePanelCubeBtn">删除当前</button>
        </div>
        <div class="lighting-control-row">
          <label>当前:</label>
          <select id="panelCubeSelect" style="flex: 1;">
            <option value="">暂无立方体</option>
          </select>
        </div>
        <div class="lighting-control-row">
          <label>长:</label>
          <input type="number" id="panelCubeSizeW" min="0.01" step="0.1" value="20" />
          <label>宽:</label>
          <input type="number" id="panelCubeSizeH" min="0.01" step="0.1" value="20" />
          <label>高:</label>
          <input type="number" id="panelCubeSizeD" min="0.01" step="0.1" value="20" />
        </div>
        <div class="lighting-control-row">
          <label>X:</label>
          <input type="number" id="panelCubePosX" step="0.1" value="10" />
          <label>Y:</label>
          <input type="number" id="panelCubePosY" step="0.1" value="10" />
          <label>Z:</label>
          <input type="number" id="panelCubePosZ" step="0.1" value="10" />
        </div>
        <div class="lighting-control-row">
          <input
            type="text"
            id="panelCubeQuickCreateInput"
            placeholder="L:20,W:20,H:20,X:10,Y:10,Z:10"
            style="flex: 1;"
          />
        </div>
      </div>
    </div>
    </div>

    <div id="floatingToolbar">
      <div class="panel-drag-handle panel-drag-handle--bar" title="拖拽移动">模型操作</div>
      <div class="floating-toolbar-buttons">
        <button id="uploadButton" type="button">上传GLB模型</button>
        <button id="clearModelsButton" type="button">清空所有模型</button>
      </div>
    </div>
    <input type="file" id="fileInput" accept=".glb,.gltf" />

    <div id="rightPanelsContainer">
    <div class="panel-drag-handle panel-drag-handle--bar" title="拖拽移动">右侧面板</div>
    <div id="rightPbrPanel">
      <h3>PBR 渲染</h3>
      <div class="pbr-group">
        <div class="pbr-param-row">
          <label>金属度</label>
          <input type="range" id="pbrMetalness" min="0" max="1" step="0.01" value="0" />
          <input type="number" id="pbrMetalnessValue" min="0" max="1" step="0.01" value="0" />
        </div>
      </div>
      <div class="pbr-group">
        <div class="pbr-param-row">
          <label>粗糙度</label>
          <input type="range" id="pbrRoughness" min="0" max="1" step="0.01" value="0.5" />
          <input type="number" id="pbrRoughnessValue" min="0" max="1" step="0.01" value="0.5" />
        </div>
      </div>
      <div class="pbr-group">
        <label class="pbr-toggle">
          <input type="checkbox" id="imageEnvMapEnabled" checked />
          启用环境贴图
        </label>
        <div id="imageEnvMapParams" style="margin-top:8px;">
          <div class="pbr-param-row">
            <label>贴图强度</label>
            <input type="range" id="pbrEnvMapIntensity" min="0" max="2" step="0.05" value="1" />
            <input type="number" id="pbrEnvMapIntensityValue" min="0" max="2" step="0.05" value="1" />
          </div>
          <div style="margin-top:8px;">
            <button type="button" id="uploadEnvMapButton" style="width:100%; padding:6px; font-size:12px; cursor:pointer; border:1px solid #ccc; border-radius:4px; background:#f5f5f5;">上传本地环境贴图</button>
            <input type="file" id="envMapFileInput" accept="image/*" style="display:none;" />
          </div>
        </div>
      </div>
      <div class="pbr-group" style="margin-top:12px;">
        <label class="pbr-toggle">
          <input type="checkbox" id="pbrEnvEnabled" checked />
          启用 PBR 与环境贴图
        </label>
      </div>
      <div class="pbr-group" style="margin-top:12px; padding-top:10px; border-top:1px solid #ddd;">
        <label class="pbr-toggle">
          <input type="checkbox" id="pbrTransparencyEnabled" checked />
          开启透明度渲染
        </label>
        <div id="pbrTransparencyControls" style="display:block; margin-top:8px;">
          <div class="pbr-param-row">
            <label>透明度</label>
            <input type="range" id="pbrOpacity" min="0" max="1" step="0.01" value="0.8" />
            <input type="number" id="pbrOpacityValue" min="0" max="1" step="0.01" value="0.8" />
          </div>
          <div class="pbr-param-row">
            <label>AlphaTest</label>
            <input type="range" id="pbrAlphaTest" min="0" max="1" step="0.01" value="0.5" />
            <input type="number" id="pbrAlphaTestValue" min="0" max="1" step="0.01" value="0.5" />
          </div>
        </div>
      </div>
      <div class="pbr-group" style="margin-top:12px; padding-top:10px; border-top:1px solid #ddd;">
        <label class="pbr-toggle">
          <input type="checkbox" id="pbrFoliageBillboardEnabled" />
          面片树渲染（双面 · 深度写入 · AlphaTest 裁切 · Unlit）
        </label>
        <div class="pbr-param-row" style="margin-top:8px;">
          <label>裁切阈值</label>
          <input type="range" id="pbrFoliageAlphaTest" min="0" max="1" step="0.01" value="0.4" />
          <input type="number" id="pbrFoliageAlphaTestValue" min="0" max="1" step="0.01" value="0.4" />
        </div>
        <div style="margin-top:6px; font-size:11px; color:#666;">
          对半透明 / 已裁切 / 带 alpha 贴图的 Standard 等材质转为 MeshBasic（顶点色×贴图）。纯不透明贴图可在材质上设 userData.forceFoliageBillboard。
        </div>
      </div>
    </div>

    </div>

    <script type="module" src="../js/main.js"></script>
  </body>
</html>
